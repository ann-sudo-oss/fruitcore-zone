<!doctype html><html lang="zh-CN"><head><script>if(location.hostname.endsWith(".github.io"))location.replace("https://wildrift-duo.munalee1987.chatgpt.site/duo.html");</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>双人远征 · 果核禁区</title><link rel="icon" href="assets/fruitcore-icon-v19.png"><link rel="stylesheet" href="duo.css?v=20"></head><body><canvas id="world"></canvas>
<section id="lobby" class="panel"><img class="icon" src="assets/fruitcore-icon-v19.png" alt="果核禁区"><p class="eyebrow">FRUITCORE · CO-OP EXPEDITION</p><h1>一起闯入禁区</h1><p>双人合作 · 独立武器背包 · 共享金币<br>靠近倒下的队友，守护 3 秒即可救援。</p><label>选择探险员 <select id="role"></select></label><div id="entry"><label>房号类型 <select id="codeType"><option value="mixed">混合号 · 字母 / 数字 / 符号</option><option value="F">特殊号 (F) + 1 位数字</option><option value="G">特殊号 (G) + 2 位数字</option></select></label><button id="create" class="primary">创建房间</button><div class="join"><input id="code" autocapitalize="characters" spellcheck="false" maxlength="5" placeholder="A7#Q2 / (F)7" aria-label="房间号"><button id="join">加入</button></div></div><div id="waiting" hidden><small>房间号 · 告诉你的队友</small><button id="roomCode" title="点击复制房间号"></button><p id="members"></p><button id="start" class="primary" disabled>等待队友加入</button><button id="leave">离开房间</button></div><p id="message" role="status"></p><small>需要双方都能访问本站。网络中断时暂停战斗；刷新页面可重连。</small><a href="./?v=20">返回单人营地</a></section>
<div id="hud" hidden><div class="top panel"><b id="zone"></b><span id="network"></span><button id="mapButton">地图 M</button><button id="bagButton">背包 B</button><button id="pause">暂停</button><button id="exit">离开</button></div><div class="health panel" id="health"></div><div class="bottom panel"><b id="weapon"></b><span id="notice"></span><div class="actions"><button data-action="shoot">开火 F</button><button data-action="dash">闪避 空格</button><button data-action="skill">技能 E</button><button data-action="swap">换枪 Q</button><button data-action="openChest">开箱 T</button><button data-action="campInteract">互动 C</button><button data-action="interact">跨区 Enter</button></div><small>WASD 移动 · 鼠标瞄准 / 左键射击 · R 装填 · G 火瓶 · 房主带队进入房间</small></div><div class="dpad"><button data-move="w">↑</button><div><button data-move="a">←</button><button data-move="s">↓</button><button data-move="d">→</button></div></div></div>
<dialog id="modal"><button id="closeModal">关闭 ×</button><h2 id="modalTitle"></h2><div id="modalBody"></div></dialog><script type="module" src="duo-main.mjs?v=20"></script></body></html>
